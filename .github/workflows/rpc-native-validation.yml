name: rpc native validation

on:
  push:
    branches: ["feat/rpc-native-validation-20261006"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpc-native-validation-canonical
  cancel-in-progress: true

jobs:
  rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch immutable public mirror and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/gha-indie-worker/gha-indie-worker-e2e.git rpc-mirror
          cd rpc-mirror
          git checkout --quiet 0d2cc07872ac25f0901e82c62de06a627f9f650f
          test "$(git rev-parse HEAD)" = "0d2cc07872ac25f0901e82c62de06a627f9f650f"
          grep -Fx "compiler_source=ores-truffle-oreslang/oreslang-source.java@3a41bed317060cc7cbab1c6be3a0ea92913c6fc9" rpc-ci/PROVENANCE.txt
          grep -Fx "rpc_source=ores-truffle-oreslang/oreslang-rpc@7d88506ba68f22b9c03c0920999abb29146a7d98" rpc-ci/PROVENANCE.txt
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "::error file=$path::compiler blob mismatch expected=$expected actual=$actual"
              exit 1
            }
          done < rpc-ci/compiler-blobs.txt
          test "$(wc -l < rpc-ci/compiler-blobs.txt)" -eq 56

      - name: Compile exact current Oreslang compiler slice
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true compile

      - name: Typecheck native RPC module directly
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/rpc.ores"

      - name: Typecheck linked RPC semantics
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/main.ores"

      - name: Execute RPC semantics and generators
        working-directory: rpc-mirror
        shell: bash
        run: |
          set -euo pipefail
          if ! mvn -q -Dstyle.color=never -Dmaven.test.skip=true exec:java -Dexec.args="--platform=server rpc-ci/main.ores" > rpc-ci/actual.txt 2> rpc-ci/runtime.err; then
            echo "=== RPC stdout before failure ==="
            cat rpc-ci/actual.txt || true
            echo "=== RPC stderr ==="
            cat rpc-ci/runtime.err || true
            exit 1
          fi
          diff -u rpc-ci/expected.txt rpc-ci/actual.txt
